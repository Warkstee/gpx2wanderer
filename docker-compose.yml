services:
  gpx2wanderer:
    build: .
    hostname: gpx2wanderer
    ports:
      - "6721:6721"
    environment:
      - NODE_ENV=production
      - PORT=6721
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASS=${ADMIN_PASS}
    volumes:
      - ./config:/root/.gpx2wanderer
    restart: unless-stopped
