version: '3.8'

services:
  gpx2wanderer:
    build: .
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - VALHALLA_URL=${VALHALLA_URL:-http://valhalla:8002}
      - WANDERER_URL=${WANDERER_URL:-http://wanderer:3000}
    restart: unless-stopped
